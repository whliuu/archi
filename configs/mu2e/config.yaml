# ---------------------------------------------------------------------------
# mu2e Shifter & Operations Assistant - Archi deployment config
# ---------------------------------------------------------------------------
# A retrieval-augmented chatbot that indexes mu2e shifter and operations
# documentation (wiki pages, MkDocs/git repos, SSO-protected pages, and local
# PDFs/Word docs) and answers shifter/ops questions with citations.
#
# Deploy with (from the archi repo root):
#   archi create --name mu2e-ops \
#     --config configs/mu2e/config.yaml \
#     --env-file configs/mu2e/secrets.env \
#     --services chatbot
#
# Notes:
#   - chatbot auto-enables its postgres + data-manager dependencies.
#   - Upload is built into the chat app; there is no separate `uploader` service.
#   - Do NOT use --hostmode on Docker Desktop (Mac/Windows): host networking is
#     unreachable from the host VM there. It is only for native Linux hosts.
#
# Any field not set here falls back to the defaults in
# src/cli/templates/base-config.yaml.
# ---------------------------------------------------------------------------

name: mu2e_ops

global:
  # Store the basic-auth accounts file on the persistent archi-data volume
  # (mounted at /root/data/ in both chatbot and data-manager). The default
  # /root/.accounts/ lives in the container's writable layer and is wiped on
  # every `archi create --force` redeploy, which deletes all registered users.
  ACCOUNTS_PATH: "/root/data/.accounts/"

# --- MCP tool servers ------------------------------------------------------
# Remote MCP servers hosted on mu2eaigpvm01 (registry: http://mu2eaigpvm01.fnal.gov:8000/list).
# Only reachable from inside the Fermilab network, so the chatbot container
# must run on a Fermilab machine. Agents opt in by listing `mcp` in their tools.
#
# Token-protected servers read the token from secrets.env via ${SECRET_NAME}
# in `headers` (expanded at runtime, never stored in the config DB). If the
# secret is unset, that server is skipped with a warning; the rest still load.
#
# NOTE: every chatbot user shares the single token below, so all shifters get
# that token owner's ECL / run-DB access.
mcp_servers:
  arxiv:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8003/mcp
  inspirehep:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8004/mcp
  dqm:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8001/mcp
  metacat:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8002/mcp
  ecl:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8005/mcp
    headers:
      Authorization: "Bearer ${MU2E_MCP_TOKEN}"
  runs:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8006/mcp
    headers:
      Authorization: "Bearer ${MU2E_MCP_TOKEN}"
  # Mu2e knowledge base: DocDB (~24k docs) + wiki, plus INSPIRE papers.
  # kb_research is left out (multi-minute server-side agent; tool calls time out
  # at 120s) and so is kb_get_image (returns images the text-only LLM can't see;
  # the chat app's /api/kb-figure route calls it instead to show figures).
  # The server must stay named `kb` for that route to find it.
  kb:
    transport: streamable_http
    url: http://mu2eaigpvm01.fnal.gov:8008/mcp
    headers:
      Authorization: "Bearer ${MU2E_MCP_TOKEN}"
    include_tools:
      - kb_search
      - kb_get
  # Live DAQ monitoring (github.com/Mu2e/daqpy, develop branch), used only by
  # the DAQ agent (`mcp:daq`). Served on mu2e-dl-02 by stock daqpy-mcp
  # (~/ots_ops/run_mcp.sh), which is unauthenticated and also serves send_chat
  # (posts to the operators' OTS chat) and tools whose arguments reach a remote
  # shell, so only these read tools are passed to the agent. read_artdaq_log is
  # left out because its host/path mode is one of those; it is safe again under
  # configs/mu2e/daq/daqpy_mcp_readonly.py, which limits it to process labels.
  # (Port 3004 on mu2e-cfo-01 is the daqpy-web dashboard, not MCP.)
  # A container on dl-02 itself can't reach dl-02's own FQDN (rootless podman's
  # pasta gives it the host IP, so the connection is refused), so the dl-02
  # deployment sets DAQ_MCP_URL=http://host.containers.internal:8765/mcp in its
  # secrets.env instead of editing this file. Other hosts use the default.
  daq:
    transport: streamable_http
    url: "${DAQ_MCP_URL:-http://mu2e-dl-02.fnal.gov:8765/mcp}"
    include_tools:
      - get_app_status
      - get_current_state
      - get_system_messages
      - search_messages
      - list_message_sources
      - list_log_files
      - read_log
      - list_artdaq_processes
      - list_artdaq_fcl_files
      - get_artdaq_stats
      - list_run_records
      - get_run_record
      - get_fe_macro_list
      - list_docs
      - read_doc
      - runlog_find
      - runlog_run
      - runlog_config
  # Not enabled: `memory` has write tools and stores documents under the token
  # owner, which every chatbot user would share. `registry` only lists servers.
  # memory:
  #   transport: streamable_http
  #   url: http://mu2eaigpvm01.fnal.gov:8007/mcp
  #   headers:
  #     Authorization: "Bearer ${MU2E_MCP_TOKEN}"

services:
  chat_app:
    agent_class: CMSCompOpsAgent          # the built-in ReAct RAG agent
    agents_dir: configs/mu2e/agents       # agent prompts + tools; mu2e-ops-shift.md is the default
    client_timeout_seconds: 1800
    trained_on: "mu2e shifter & operations documentation"

    # --- Authentication ------------------------------------------------------
    # Username/password login. Each user gets their own private chat history
    # (conversations are keyed to the logged-in username). No external IdP.
    #
    # Required secrets (in secrets.env):
    #   FLASK_UPLOADER_APP_SECRET_KEY  - signs session cookies; MUST be stable
    #                                    or every restart logs all users out.
    #   UPLOADER_SALT                  - salt for hashing account passwords.
    # Create accounts (on the deployment host, inside the venv/container):
    #   python -m src.bin.service_create_account
    #
    # LLM keys: NOT required any more. The default backend is Fermilab's
    # self-hosted vLLM (GPT-OSS 120B), which is keyless, so a freshly
    # registered shifter can chat immediately. Per-user BYOK still works for
    # the optional cern_litellm/Claude route: a user opens the provider
    # settings in the chat UI and pastes their OWN litellm.fnal.gov virtual
    # key; it is stored in that user's session and billed to them.
    auth:
      enabled: true
      basic:
        enabled: true
      sso:
        enabled: false
      # Usernames that get full admin rights (Data tab, document upload, source
      # management, database viewer) when they log in. Everyone else is a
      # normal chat-only user. Edit this list to your real admin username(s).
      admin_users:
        - admin
        - whliuu
      # Role -> permission model. Admins get the wildcard; base-user (every
      # non-admin) gets NO management permissions. NOTE: chat/retrieval is NOT
      # permission-gated, so base-user still gets full RAG answers over the
      # whole indexed corpus. To let regular users also BROWSE the Data tab,
      # add 'documents:view' to base-user's permissions below.
      auth_roles:
        app_name: archi-mu2e
        default_role: base-user
        roles:
          admin:
            description: Full administrative access
            permissions: ['*']
          base-user:
            description: Regular shifter — chat only
            permissions: []

    # --- LLM backend ---------------------------------------------------------
    # DEFAULT FOR EVERYONE: GPT-OSS 120B on Fermilab's self-hosted vLLM
    # (vllm.fnal.gov). It is OpenAI-compatible and needs NO API key, so every
    # logged-in shifter gets working answers out of the box without pasting a
    # personal LiteLLM key. Only reachable from inside Fermilab's network.
    #
    # archi has no dedicated "vllm" provider; the built-in `local` provider in
    # openai_compat mode IS the vLLM path (src/archi/providers/local_provider.py
    # -> _get_openai_compat_model), so `local` below means "Fermilab vLLM", not
    # a laptop Ollama.
    #
    # cern_litellm stays enabled but non-default: users who want Claude and
    # have their own litellm.fnal.gov key can still pick it in the provider
    # settings. To go back to OpenRouter for local dev, set
    # default_provider: openrouter and enable the openrouter block below.
    default_provider: local
    default_model: "gpt-oss:120b"
    providers:
      local:
        enabled: true
        mode: openai_compat                     # ChatOpenAI against a vLLM server
        base_url: "https://vllm.fnal.gov/v1"    # note: WITH /v1 (unlike litellm below)
        default_model: "gpt-oss:120b"
        models:
          - "gpt-oss:120b"
      cern_litellm:
        enabled: true
        base_url: "https://litellm.fnal.gov/"   # Fermilab LiteLLM gateway (note: no /v1)
        default_model: "azure/claude-sonnet-5-5"
        models:
          - "azure/claude-sonnet-5-5"
          - "azure/claude-haiku-5-5"
          - "azure/claude-haiku-4-5"
      openrouter:
        enabled: false
        default_model: "qwen/qwen-2.5-72b-instruct"
        models:
          - "qwen/qwen-2.5-72b-instruct"
          - "meta-llama/llama-3.3-70b-instruct"
          - "deepseek/deepseek-r1"
    port: 7861
    external_port: 7861

  # NOTE: There is no deployable `uploader` service in this build — document
  # upload is built into the chat app (and the data-manager handles ingestion).
  # The block below is left for reference only; it has no effect.
  # uploader:
  #   # Admin UI for hand-uploading shifter manuals / run plans at /upload
  #   port: 7863
  #   external_port: 7863

  vectorstore:
    backend: postgres                     # PostgreSQL + pgvector (only backend)

  data_manager:
    port: 7871
    external_port: 7871
    auth:
      enabled: false                      # set true + DM_API_TOKEN for production

data_manager:
  collection_name: mu2e_ops
  # Do NOT wipe the vectorstore on every data-manager start. The template
  # default is true, which truncates document_chunks and re-embeds the whole
  # corpus each boot. With this false, update_vectorstore() does an incremental
  # diff: stale chunks removed, only new resource_hashes embedded.
  # CAVEAT: resource_hash is md5(url), so an EDITED page at an unchanged URL
  # keeps its hash and will NOT be re-embedded. To pick up edits, delete those
  # documents first, or flip this back to true for one restart.
  reset_collection: false
  # API-based embeddings (OpenAI text-embedding-3-small). Fast and offloads
  # vector computation from the CPU; needs OPENAI_API_KEY in secrets.env.
  # To go fully local/key-free instead, set embedding_name: HuggingFaceEmbeddings
  # (sentence-transformers/all-MiniLM-L6-v2 on CPU) — slower for large PDFs.
  embedding_name: OpenAIEmbeddings
  embedding_class_map:
    OpenAIEmbeddings:
      class: OpenAIEmbeddings
      kwargs:
        model: text-embedding-3-small
      # text-embedding-3-small emits 1536-dim vectors. This MUST be set, or the
      # CLI falls back to 384 (the MiniLM default) and builds a mismatched
      # vector(384) Postgres column.
      dimensions: 1536
      similarity_score_reference: 10
  # Back to finer chunks: with API embeddings the chunk count no longer drives
  # CPU time, so prefer better retrieval granularity. (text-embedding-3-small
  # handles up to 8191 tokens, so 1000-char chunks are embedded in full.)
  chunk_size: 1000
  chunk_overlap: 100

  # Retrieval weighting. The template defaults are bm25 0.6 / semantic 0.4,
  # which lets keyword noise outrank meaning: on a Mu2e wiki, tokens like
  # "mu2e" and "computing" appear on nearly every page, so the BM25 pool fills
  # with near-random chunks and (being weighted higher) wins the RRF fusion.
  # That is why recall degraded as more pages were scraped. Favour semantic;
  # BM25 still earns its keep for exact identifiers (TrkAna, error strings).
  retrievers:
    hybrid_retriever:
      num_documents_to_retrieve: 8
      bm25_weight: 0.3
      semantic_weight: 0.7

  sources:
    # 1) Web pages / wiki ----------------------------------------------------
    links:
      enabled: true
      visible: true
      base_source_depth: 1
      input_lists:
        - configs/mu2e/sources/mu2e_links.list
      html_scraper:
        reset_data: true
        verify_urls: false
        enable_warnings: false
      # 2) SSO-protected pages (Selenium) ----------------------------------
      # Pages behind Fermilab SSO. Prefix those URLs with `sso-` in the list.
      # NOTE: the bundled CERNSSOScraper targets the CERN SSO flow; the
      # Fermilab SSO login form differs, so this may need a custom scraper
      # class (see configs/mu2e/README.md). Disabled by default until creds
      # + a working scraper are in place.
      selenium_scraper:
        enabled: true
        use_for_scraping: true            # fetch pages through Firefox, not plain HTTP
        # PassthroughSeleniumScraper renders with a real browser but does NOT
        # log in — right for mu2ewiki (Cloudflare bot challenge, public content).
        # For genuinely SSO-protected Fermilab pages a custom login scraper is
        # still needed (see configs/mu2e/README.md).
        selenium_class: PassthroughSeleniumScraper
        selenium_class_map:
          PassthroughSeleniumScraper:
            class: PassthroughSeleniumScraper
            kwargs:
              headless: true
              max_depth: 2

    sso:
      enabled: true                       # routes sso- prefixed URLs through Selenium

    # 3) Git / MkDocs documentation repos -----------------------------------
    # Prefix repo URLs with `git-` in the link list above.
    # Disabled for local dev: no git repos in the .list yet, and enabling it
    # forces GIT_USERNAME/GIT_TOKEN secrets. Flip back on once you add a repo.
    git:
      enabled: false
      visible: true

    # 4) Local files: PDFs / Word / Markdown shifter manuals ----------------
    # Host paths here are staged into the data volume automatically at deploy.
    local_files:
      enabled: true
      visible: true
      paths:
        - configs/mu2e/local_docs
